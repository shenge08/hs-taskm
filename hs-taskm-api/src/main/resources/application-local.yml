server:
  port: 8080

spring:
  application:
    name: hs-taskm-api
  datasource:
    url: jdbc:postgresql://localhost:5432/hs-taskm
    username: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    sql:
      init:
        mode: never

# MyBatis-Plus configuration
mybatis-plus:
  type-handlers-package: com.taskm.handler
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl

# SpringDoc OpenAPI (Swagger) 配置
springdoc:
  api-docs:
    enabled: true
    path: /api-docs
  swagger-ui:
    enabled: true
    path: /swagger-ui.html
    default-models-expand-depth: 2
    try-it-out-enabled: true
  group-config:
    enabled: true

# Actuator 配置
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always
