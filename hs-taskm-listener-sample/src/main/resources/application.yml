server:
  port: ${SERVER_PORT:8080}
  servlet:
    context-path: /

spring:
  application:
    name: taskm-listener-sample

  # JSON configuration
  jackson:
    default-property-inclusion: non_null
    serialization:
      write-dates-as-timestamps: false
    deserialization:
      fail-on-unknown-properties: false

  # Actuator configuration
  management:
    endpoints:
      web:
        exposure:
          include: health,info,metrics
        base-path: /actuator
    endpoint:
      health:
        show-details: always
    info:
      env:
        enabled: true

# OpenAPI/Swagger configuration
springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    enabled: true
    operations-sorter: method
    tags-sorter: alpha
  show-actuator: true

# Logging configuration
logging:
  level:
    root: INFO
    com.taskm.listener.sample: DEBUG
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} - %logger{36} - %level - %msg%n"
    file: "%d{yyyy-MM-dd HH:mm:ss} - %logger{36} - %level - %msg%n"
  file:
    name: logs/listener-sample.log

# TaskM SDK configuration (read via Environment class)
# LOG_LEVEL: DEBUG, INFO, WARNING, ERROR (default: INFO)
# LOG_FORMAT: text, json (default: text)

# BIMS (Bond Trading Management System) API configuration
# These environment variables are REQUIRED for BondTradingApiClient
# BIMS_BASE_URL: Base URL of the BIMS API (e.g., http://172.16.90.114:8081) - REQUIRED
# BIMS_USERNAME: Login username for BIMS API - REQUIRED
# BIMS_PASSWORD: Login password for BIMS API - REQUIRED
#
# Withdrawal polling configuration for handleCancelOrder (optional)
# WITHDRAWAL_MAX_RETRIES: Maximum number of retries when polling withdrawal result (default: 10)
# WITHDRAWAL_POLL_INTERVAL_MS: Polling interval in milliseconds (default: 1000)
# WITHDRAWAL_SUCCESS_WAIT_MS: Wait time after successful withdrawal for data sync (default: 10000)


