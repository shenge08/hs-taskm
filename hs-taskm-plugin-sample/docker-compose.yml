version: '3.8'

services:
  plugin:
    build:
      context: .
      dockerfile: Dockerfile
    image: taskm-plugin-sample:1.0.0
    container_name: taskm-plugin
    ports:
      - "8080:8080"
    environment:
      # Server configuration
      - SERVER_PORT=8080

      # Logging configuration
      - LOG_LEVEL=INFO
      - LOG_FORMAT=text

      # Java/JVM options
      - JAVA_OPTS=-Xmx512m -Xms256m
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    volumes:
      # Mount logs directory
      - ./logs:/app/logs
    networks:
      - taskm-network

networks:
  taskm-network:
    driver: bridge

# Example usage:
# 1. Build JAR locally: mvn clean package -DskipTests
# 2. Build and start: docker-compose up -d
# 3. View logs: docker-compose logs -f plugin
# 4. Stop: docker-compose down
# 5. Check health: curl http://localhost:8080/api/health
